<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Binary Adding Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row mb-4">
      <div class="col-md-8">
        <h1 class="mb-3">Binary Adding Quiz</h1>
        <p class="text-muted">Answer the sum in the same format the question is shown.</p>
      </div>
      <div class="col-md-4 text-md-end align-self-center">
        <div id="scoreDisplay" class="h5">Score: 0 / 0</div>
        <div id="qCountDisplay" class="text-muted">Questions: 0 / 10</div>
+        <div class="mt-2">
          <span id="formatBadge" class="badge bg-secondary">FORMAT</span>
        </div>
      </div>
    </div>

    <div class="card mb-4">
        <div class="card mb-3">
          <div class="card-body">
            <div id="controlsHelp" class="mb-2 text-muted">Press Start to generate 10 questions. Check answers individually or use Check All.</div>

            <div id="questionsContainer" class="list-group mb-3">
              <!-- questions rendered here -->
            </div>

            <div class="d-flex gap-2">
              <button id="checkAllBtn" class="btn btn-primary">Check All</button>
              <button id="revealAllBtn" class="btn btn-outline-secondary">Reveal Answers</button>
            </div>

            <div id="overallFeedback" class="mt-3"></div>
          </div>
        </div>
        <div class="text-end">
          <button id="resetBtn" class="btn btn-outline-secondary">Reset</button>
        </div>
            <select id="formatSelect" class="form-select">
              <option value="binary">Binary (standard addition)</option>
              <option value="dismal">Dismal (digitwise max)</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label">Numbers per question</label>
            <select id="numCountSelect" class="form-select">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label">Level</label>
            <select id="levelSelect" class="form-select">
              <option value="easy">Easy (4 bits)</option>
              <option value="medium">Medium (8 bits)</option>
              <option value="hard">Hard (12 bits)</option>
            </select>
          </div>
          <div class="col-sm-2 text-end">
            <button id="startBtn" type="button" class="btn btn-success w-100">Start</button>
            <button id="newRoundBtn" type="button" class="btn btn-outline-primary w-100 mt-2">New Round</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div id="questionHeader" class="mb-2 text-muted">Press Start to begin a 10-question round.</div>
        <div id="questionDisplay" class="fs-4 fw-bold mb-3">—</div>

        <div class="input-group mb-3">
          <input id="answerInput" type="text" class="form-control" placeholder="Enter your answer here">
          <button id="submitBtn" class="btn btn-primary" type="button">Submit</button>
          <button id="nextBtn" class="btn btn-secondary" type="button" disabled>Next</button>
        </div>

        <div id="feedback" class="mb-0"></div>
      </div>
    </div>

    <div class="text-end">
      <button id="showAnswerBtn" class="btn btn-outline-danger">Show Answer</button>
      <button id="resetBtn" class="btn btn-outline-secondary">Reset</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
