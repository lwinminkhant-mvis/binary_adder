<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Binary Adding Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-col {
      display: flex;
      flex-direction: column;
    }
    .form-col .form-label {
      flex-grow: 1;
      display: flex;
      align-items: flex-start;
    }
  </style>
</head>
<body>
  <div id="banner" style="position: relative; width: 100%; max-height: 140px; overflow: hidden;">
    <img src="binary.jpg" alt="Binary Banner" style="width: 100%; height: auto; display: block;">
    <div id="headerText" style="position: absolute; top: 50%; left: 5%; transform: translateY(-50%); color: white;">
      <h1 class="mb-3" style="color: white;">Binary Adding Quiz</h1>
      <p style="color: white;">Answer the sum in the same format the question is shown.</p>
    </div>
    <div id="headerStats" style="position: absolute; top: 10px; right: 20px; text-align: right; color: white;">
      <div style="margin-bottom: 10px;">
        <span id="formatBadge" class="badge bg-secondary">FORMAT</span>
      </div>
      <div id="scoreStats" style="display: none; font-size: 14px;">
        <div id="scoreDisplay" style="color: white; font-weight: bold;">Score: 0 / 0</div>
      </div>
    </div>
  </div>
  <div id="main" class="container py-3">
    <!-- Controls -->
    <div id="controlsCard" class="card mb-4">
      <div class="card-body">
        <form id="controlsForm" class="row g-3">
          <div class="col form-col">
            <label class="form-label">Format</label>
            <select id="formatSelect" class="form-select">
              <option value="binary">Binary (base 2)</option>
              <option value="hexadecimal">Hexadecimal (base 16)</option>
            </select>
          </div>
          <div class="col form-col">
            <label class="form-label">Numbers to add</label>
            <select id="numCountSelect" class="form-select">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="col form-col">
            <label class="form-label">Level</label>
            <select id="levelSelect" class="form-select">
              <option value="easy">Easy (4 bits)</option>
              <option value="medium">Medium (8 bits)</option>
              <option value="hard">Hard (12 bits)</option>
            </select>
          </div>
          <div class="col form-col">
            <label class="form-label">Number of questions</label>
            <select id="questionCountSelect" class="form-select">
              <option value="1">1</option>
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="15">15</option>
              <option value="20">20</option>
            </select>
          </div>
          <div class="col-auto form-col">
            <label class="form-label" style="visibility: hidden;">.</label>
            <button id="startBtn" type="button" class="btn btn-success">Start</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Quiz -->
    <div id="quizCard" class="card mb-4" style="display: none;">
      <div id="quizCardBody" class="card-body">
        <div id="initialPrompt" class="mb-3 text-muted alert alert-info" style="display: none;">Press Start to generate 10 questions.</div>

        <div id="questionsContainer" class="list-group mb-3">
          <!-- questions rendered here -->
        </div>

        <div id="buttonGroup" class="d-flex gap-2" style="display: none !important;">
          <button id="checkAllBtn" class="btn btn-primary">Check All</button>
        </div>

        <div id="overallFeedback" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
